<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Observation Archive — Upstate SC Weather</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .archive-wrap { max-width:1400px; margin:0 auto; padding:24px 20px; }
    .archive-controls {
      display:flex; gap:12px; flex-wrap:wrap; align-items:center;
      margin-bottom:20px; background:var(--card-bg);
      border:1px solid var(--border); border-radius:8px; padding:16px 20px;
    }
    .archive-controls select, .archive-controls input {
      padding:7px 12px; border:1px solid var(--border); border-radius:4px;
      font-family:'Barlow Condensed',sans-serif; font-size:0.9rem;
      font-weight:600; color:var(--text-dark); background:#fff; letter-spacing:0.03em;
    }
    .archive-controls label {
      font-family:'Barlow Condensed',sans-serif; font-weight:700;
      font-size:0.78rem; letter-spacing:0.08em; text-transform:uppercase;
      color:var(--sky-mid); white-space:nowrap;
    }
    .snap-btn {
      font-family:'Barlow Condensed',sans-serif; font-weight:700;
      font-size:0.82rem; letter-spacing:0.06em; text-transform:uppercase;
      background:var(--sky-mid); color:#fff; border:none;
      padding:7px 16px; border-radius:4px; cursor:pointer; transition:background 0.15s;
    }
    .snap-btn:hover { background:var(--sky-bright); }
    .export-btn {
      font-family:'Barlow Condensed',sans-serif; font-weight:700;
      font-size:0.82rem; letter-spacing:0.06em; text-transform:uppercase;
      background:var(--accent-green); color:#fff; border:none;
      padding:7px 16px; border-radius:4px; cursor:pointer; transition:background 0.15s;
      margin-left:auto;
    }
    .stat-cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; margin-bottom:20px; }
    .stat-card { background:var(--card-bg); border:1px solid var(--border); border-radius:8px; padding:14px 16px; }
    .stat-label { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:0.75rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-light); }
    .stat-val { font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:1.8rem; color:var(--sky-mid); }
    .stat-sub { font-size:0.75rem; color:var(--text-light); font-style:italic; }
    .empty-state { padding:40px; text-align:center; color:var(--text-light); font-style:italic; }
  </style>
</head>
<body data-base="./">
<script src="js/shared.js"></script>

<main class="archive-wrap">
  <div class="section-title">📊 Observation Archive</div>

  <!-- Controls -->
  <div class="archive-controls">
    <label>City:</label>
    <select id="filter-city" onchange="renderArchive()">
      <option value="">All Cities</option>
    </select>
    <label>Date From:</label>
    <input type="date" id="filter-from" onchange="renderArchive()">
    <label>To:</label>
    <input type="date" id="filter-to" onchange="renderArchive()">
    <button class="snap-btn" id="snap-btn">📸 Snapshot Current Obs</button>
    <button class="snap-btn" style="background:#b71c1c;" onclick="clearArchive()">🗑 Clear Archive</button>
    <button class="export-btn" onclick="exportCSV()">⬇ Export CSV</button>
  </div>

  <!-- Stats -->
  <div class="stat-cards" id="stat-cards"></div>

  <!-- Table -->
  <div style="background:var(--card-bg);border:1px solid var(--border);border-radius:8px;overflow:hidden;overflow-x:auto;">
    <div id="archive-table-wrap"><div class="empty-state">Loading archive…</div></div>
  </div>

  <div style="margin-top:10px;font-size:0.8rem;color:var(--text-light);font-style:italic;">
    Observations are fetched from NOAA/NWS automated stations. Manual snapshots can be saved above. Data stored locally in your browser.
  </div>
</main>

<script src="js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  // Fill city filter
  const sel = document.getElementById('filter-city');
  Object.entries(UW.CITIES).forEach(([key, city]) => {
    const opt = document.createElement('option');
    opt.value = key; opt.textContent = city.name;
    sel.appendChild(opt);
  });

  // Pre-select from URL
  const params = new URLSearchParams(location.search);
  if (params.get('city')) sel.value = params.get('city');

  renderArchive();
  renderStats();

  document.getElementById('snap-btn').addEventListener('click', async () => {
    document.getElementById('snap-btn').textContent = '⏳ Snapping…';
    await UW.fetchAllObs();
    Object.entries(UW.CITIES).forEach(([key, city]) => {
      const obs = UW.state.observations[city.station];
      if (obs && obs.temp !== null) ObsArchive.addRecord(key, obs);
    });
    renderArchive();
    renderStats();
    document.getElementById('snap-btn').textContent = '✓ Saved!';
    setTimeout(() => document.getElementById('snap-btn').textContent = '📸 Snapshot Current Obs', 2000);
  });
});

function renderArchive() {
  const cityFilter = document.getElementById('filter-city').value;
  const fromVal = document.getElementById('filter-from').value;
  const toVal = document.getElementById('filter-to').value;
  let records = ObsArchive.getAll();

  if (cityFilter) records = records.filter(r => r.city === cityFilter);
  if (fromVal) records = records.filter(r => r.savedAt >= fromVal);
  if (toVal) records = records.filter(r => r.savedAt <= toVal + 'T23:59:59');

  const wrap = document.getElementById('archive-table-wrap');
  if (!records.length) {
    wrap.innerHTML = '<div class="empty-state">No archived observations match your filters.<br><small>Use "Snapshot Current Obs" to save current conditions.</small></div>';
    return;
  }
  ObsArchive.renderTable(wrap, null);
  // Re-render with filter applied
  wrap.innerHTML = `
    <table class="archive-table">
      <thead><tr>
        <th>Date/Time (ET)</th><th>City</th><th>Temp</th><th>Dewpoint</th>
        <th>Wind</th><th>Humidity</th><th>Condition</th>
      </tr></thead>
      <tbody>${records.slice(0,300).map(r => `
        <tr>
          <td>${new Date(r.savedAt).toLocaleString('en-US',{timeZone:'America/New_York'})}</td>
          <td>${UW.CITIES[r.city]?.name || r.city}</td>
          <td>${r.temp != null ? r.temp + '°F' : '—'}</td>
          <td>${r.dewpoint != null ? r.dewpoint + '°F' : '—'}</td>
          <td>${r.windDir||''} ${r.windSpeed != null ? r.windSpeed + ' mph' : '—'}${r.windGust ? ` G${r.windGust}` : ''}</td>
          <td>${r.humidity != null ? r.humidity + '%' : '—'}</td>
          <td>${r.condition || '—'}</td>
        </tr>`).join('')}</tbody>
    </table>`;
}

function renderStats() {
  const records = ObsArchive.getAll();
  const temps = records.map(r => r.temp).filter(v => v !== null && v !== undefined);
  const container = document.getElementById('stat-cards');
  if (!records.length) { container.innerHTML = ''; return; }

  const maxTemp = temps.length ? Math.max(...temps) : null;
  const minTemp = temps.length ? Math.min(...temps) : null;
  const avgTemp = temps.length ? Math.round(temps.reduce((a,b)=>a+b,0)/temps.length) : null;

  container.innerHTML = `
    <div class="stat-card"><div class="stat-label">Records</div><div class="stat-val">${records.length}</div><div class="stat-sub">total observations</div></div>
    <div class="stat-card"><div class="stat-label">Hottest</div><div class="stat-val">${maxTemp !== null ? maxTemp + '°' : '—'}</div><div class="stat-sub">recorded temp</div></div>
    <div class="stat-card"><div class="stat-label">Coldest</div><div class="stat-val">${minTemp !== null ? minTemp + '°' : '—'}</div><div class="stat-sub">recorded temp</div></div>
    <div class="stat-card"><div class="stat-label">Average</div><div class="stat-val">${avgTemp !== null ? avgTemp + '°' : '—'}</div><div class="stat-sub">mean temp</div></div>`;
}

function clearArchive() {
  if (confirm('Clear all archived observations? This cannot be undone.')) {
    localStorage.removeItem('uw_obs_archive');
    renderArchive();
    renderStats();
  }
}

function exportCSV() {
  const records = ObsArchive.getAll();
  if (!records.length) { alert('No records to export.'); return; }
  const headers = ['DateTime_ET','City','Temp_F','Dewpoint_F','Wind_mph','Gust_mph','Humidity_pct','Pressure_mb','Visibility_mi','Condition'];
  const rows = records.map(r => [
    new Date(r.savedAt).toLocaleString('en-US',{timeZone:'America/New_York'}),
    UW.CITIES[r.city]?.name || r.city,
    r.temp ?? '', r.dewpoint ?? '',
    r.windSpeed ?? '', r.windGust ?? '',
    r.humidity ?? '', r.pressure ?? '',
    r.visibility ?? '', (r.condition||'').replace(/,/g,';')
  ].join(','));
  const csv = [headers.join(','), ...rows].join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv,' + encodeURIComponent(csv);
  a.download = `upstate-sc-obs-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}
</script>
</body>
</html>
