<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Articles — Upstate SC Weather</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-base="../">
<script src="../js/shared.js"></script>

<main style="max-width:1400px;margin:0 auto;padding:24px 20px;">

  <div class="section-title">📰 Weather Articles</div>

  <!-- Admin: New Article Button -->
  <div class="admin-only" style="margin-bottom:20px;display:none">
    <a href="new.html" class="edit-btn" style="text-decoration:none;display:inline-block;padding:8px 20px;font-size:0.9rem;">
      ✏ Write New Article
    </a>
  </div>

  <!-- Tag Filter -->
  <div id="tag-filters" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;">
    <button class="tag-btn active" data-tag="" onclick="filterTag(this,'')">All</button>
  </div>

  <div class="article-list" id="article-list">
    Loading articles…
  </div>

</main>

<script src="../js/main.js"></script>
<script>
let allArticles = [];

document.addEventListener('DOMContentLoaded', () => {
  allArticles = Articles.getAll();
  renderArticles(allArticles);
  buildTagFilters();
  document.querySelectorAll('.admin-only').forEach(el => el.style.display = UW.state.isAdmin ? '' : 'none');
});

function renderArticles(arts) {
  const container = document.getElementById('article-list');
  if (!arts.length) {
    container.innerHTML = '<p style="color:var(--text-light);font-style:italic;padding:20px 0">No articles yet. Check back soon!</p>';
    return;
  }
  container.innerHTML = arts.map(a => `
    <div class="article-card" style="position:relative;">
      ${UW.state.isAdmin ? `<button onclick="deleteArticle('${a.id}')" style="position:absolute;top:12px;right:12px;background:#c62828;color:#fff;border:none;padding:3px 8px;border-radius:3px;font-size:0.72rem;font-family:'Barlow Condensed',sans-serif;font-weight:700;cursor:pointer;letter-spacing:0.06em;">DELETE</button>` : ''}
      <div class="article-tag">${a.tag || 'Weather'}</div>
      <a href="article.html?id=${a.id}" style="text-decoration:none;">
        <div class="article-title">${a.title}</div>
        <div class="article-excerpt">${(a.content||'').replace(/<[^>]*>/g,'').substring(0,180)}…</div>
        <div class="article-date">${new Date(a.date).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}</div>
      </a>
    </div>`).join('');
}

function buildTagFilters() {
  const tags = [...new Set(allArticles.map(a => a.tag).filter(Boolean))];
  const container = document.getElementById('tag-filters');
  tags.forEach(tag => {
    const btn = document.createElement('button');
    btn.className = 'tag-btn';
    btn.dataset.tag = tag;
    btn.textContent = tag;
    btn.onclick = function(){ filterTag(this, tag); };
    container.appendChild(btn);
  });
}

function filterTag(btn, tag) {
  document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderArticles(tag ? allArticles.filter(a => a.tag === tag) : allArticles);
}

function deleteArticle(id) {
  if (confirm('Delete this article permanently?')) {
    Articles.delete(id);
    allArticles = Articles.getAll();
    renderArticles(allArticles);
  }
}
</script>

<style>
.tag-btn {
  font-family:'Barlow Condensed',sans-serif; font-weight:700;
  font-size:0.78rem; letter-spacing:0.08em; text-transform:uppercase;
  padding:5px 14px; border-radius:15px; border:2px solid var(--border);
  background:var(--card-bg); color:var(--text-mid); cursor:pointer; transition:all 0.15s;
}
.tag-btn.active, .tag-btn:hover { background:var(--sky-mid); color:#fff; border-color:var(--sky-mid); }
</style>
</body>
</html>
